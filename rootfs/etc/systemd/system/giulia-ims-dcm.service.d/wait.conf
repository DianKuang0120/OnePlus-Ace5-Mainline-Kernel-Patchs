[Unit]
After=ModemManager.service
Wants=ModemManager.service

[Service]
# The modem must finish initial registration and bring up its default PDN
# before DCM asks for the IMS PDN; otherwise the modem firmware asserts in
# DS_3GPP_BEARER_SWITCH_COMPLETE_IND.
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 90 ]; do s=$(mmcli -m 0 --output-keyvalue 2>/dev/null | awk -F": *" "/modem.generic.state[ ]+:/{print \$2}"); r=$(mmcli -m 0 --output-keyvalue 2>/dev/null | awk -F": *" "/modem.3gpp.registration-state[ ]+:/{print \$2}"); if [ "$s" = connected ] && [ "$r" = home ]; then exit 0; fi; i=$((i+1)); sleep 2; done; exit 0'
