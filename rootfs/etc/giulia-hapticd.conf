# giulia-hapticd - user-space haptics daemon for OnePlus 13R / Ace 5 (giulia)
#
# Maps input / desktop events to stock Android haptics effects, played
# through qcom-haptics-play.  effect id 0 disables an event.
#
# Event names: power, volume_up, volume_down, slider_up, slider_mid,
#              slider_down, notification, ui_desktop, ui_showdesktop

player      = /usr/local/bin/qcom-haptics-play
gain        = 100          # percent (0..100); 100 = full drive
min_gap_ms  = 40

# evdev device names (from /sys/class/input/eventN/device/name)
dev_power   = pmic_pwrkey
dev_volup   = pmic_resin
dev_voldown = gpio-keys
dev_slider  = ak09970-slider

# event -> effect id (see /usr/share/haptics/vibrator_effect.json)
power         = 2
volume_change = 111
slider_up     = 0
slider_mid    = 365
slider_down   = 308

# desktop events (session D-Bus)
notification  = 105
ui_desktop    = 6
ui_showdesktop = 6

# window events (via the KWin "Giulia Haptics" script)
ui_maximize   = 6
ui_snap       = 105
ui_minimize   = 6
