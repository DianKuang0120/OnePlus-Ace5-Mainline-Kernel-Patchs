SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in speakers"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

# Capture.
#
# giulia analog mics (from vendor odm_ext/etc/mixer_paths.xml):
#   AMIC1 = bottom main           -> ADC1 -> SWR_MIC0
#   AMIC5 = secondary/top ("sec") -> ADC4 -> SWR_MIC3
#   AMIC3 = bottom-right          -> ADC2 -> SWR_MIC1
#   AMIC2 = headset               -> ADC2 -> SWR_MIC1
#   AMIC4 = (HDR/unprocessed)     -> ADC3 -> SWR_MIC2
#
# The WCD939X capture chain is ADCn_OUTPUT <- ADCn_MIXER <- ADCn REQ <- ADCn
# <- ADCn MUX.  "ADCn_MIXER Switch" defaults OFF and MUST be enabled, otherwise
# the ADC never drives its SoundWire TX channel (this is why only ADC1 used to
# work).  On the LPASS side DECn picks a SWR stream via TX SMIC MUXn, where
# TX SWR_INPUT(m) <- ADC(m+1)_OUTPUT, so DECn = ADC(n+1).
#
# The capture PCM (hw:0,2) is fixed 2-channel; DEC0 -> ch0, DEC1 -> ch1.
SectionDevice."Mic1" {
	Comment "Bottom Microphone (main)"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Volume' 6"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic2" {
	Comment "Top Microphone (secondary)"

	EnableSequence [
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC4 MUX' CH4_AMIC5"
		cset "name='ADC4 Volume' 6"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 MUX' CH4_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 90
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC4"
	}
}

SectionDevice."MicStereo" {
	Comment "Stereo Microphone (bottom + top)"

	EnableSequence [
		# bottom -> DEC0 -> ch0
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Volume' 6"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
		# top -> DEC1 -> ch1
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC4 MUX' CH4_AMIC5"
		cset "name='ADC4 Volume' 6"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC3"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 84"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 MUX' CH4_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 250
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic3" {
	Comment "Bottom-right Microphone"

	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' CH2_AMIC3"
		cset "name='ADC2 Volume' 6"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 80
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' CH2_AMIC2"
		cset "name='ADC2 Volume' 6"
		cset "name='MBHC Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 300
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
		JackHWMute "Mic1"
		JackHWMute "Mic2"
		JackHWMute "MicStereo"
		JackHWMute "Mic3"
	}
}
