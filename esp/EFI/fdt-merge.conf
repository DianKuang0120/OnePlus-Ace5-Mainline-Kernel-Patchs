# \EFI\fdt-merge.conf
#
# Paths are relative to the root of the ESP this .efi was loaded from.

# Linux DTB to patch (your static mainline DT, capids are stale)
# NOTE: on giulia this file lives at the *root* of the ESP, not in \EFI\
base = \sm8650-oneplus-giulia.dtb

# Bootloader to chain-load after merging
next = \EFI\systemd\systemd-bootaa64.efi

# Optional: also write the merged DT here, if your systemd-boot entry
# uses "devicetree" (then point it at this file instead of base).
# out = \EFI\merged.dtb
